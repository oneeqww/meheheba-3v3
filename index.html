$('pok').onclick=pickOk;
function tickPick(){ptmr-=.25;$('ptm').textContent=Math.max(0,Math.ceil(ptmr));roster.forEach((r,i)=>{if(i&&!r.ok&&ptmr<=30-r.at){r.ok=1;r.type=rnh()}});
if(!roster[0].ok&&ptmr<=0)pickOk();drawSlots();

function seen(x,z){if(x*(ptm?-1:1)<0)return true;for(const h of heroes)if(h.team==ptm&&!h.dead&&Math.hypot(h.x-x,h.z-z)<24)return true;
for(const c of creeps)if(c.team==ptm&&!c.dead&&Math.hypot(c.x-x,c.z-z)<16)return true;for(const w of towers)if(w.team==ptm&&!w.dead&&Math.hypot(w.x-x,w.z-z)<22)return true;
const c=crys[ptm];return Math.hypot(c.x-x,c.z-z)<24}
const fc=document.createElement('canvas');fc.width=170;fc.height=100;const fx2=fc.getContext('2d'),ft=new T.CanvasTexture(fc),
fm=new T.Mesh(new T.PlaneGeometry(170,100).rotateX(-Math.PI/2),new T.MeshBasicMaterial({map:ft,transparent:true,depthWrite:false}));fm.position.y=.09;S.add(fm);
function hole(x,z,r){const g=fx2.createRadialGradient(x+85,z+50,r*.55,x+85,z+50,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');fx2.fillStyle=g;fx2.fillRect(x+85-r,z+50-r,r*2,r*2)}
function fogDraw(){fx2.globalCompositeOperation='source-over';fx2.clearRect(0,0,170,100);fx2.fillStyle='rgba(10,8,25,.62)';fx2.fillRect(0,0,170,100);fx2.globalCompositeOperation='destination-out';
fx2.fillStyle='#000';fx2.fillRect(ptm?85:0,0,85,100);heroes.forEach(h=>{if(h.team==ptm&&!h.dead)hole(h.x,h.z,24)});creeps.forEach(c=>{if(c.team==ptm&&!c.dead)hole(c.x,c.z,16)});
towers.forEach(w=>{if(w.team==ptm&&!w.dead)hole(w.x,w.z,22)});hole(crys[ptm].x,crys[ptm].z,24);ft.needsUpdate=true}
const mx2=$('mm').getContext('2d'),mp=(x,z)=>[(x+85)*132/170,(z+50)*.8];
function mmDraw(){const g=mx2;g.fillStyle='#4a8f4a';g.fillRect(0,0,66,80);g.fillStyle='#3a3050';g.fillRect(66,0,66,80);g.strokeStyle='#c9b27a';g.lineWidth=3;
for(let l=0;l<2;l++){g.beginPath();LANES[l][0].forEach((p,i)=>{const q=mp(p.x,p.z);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])});g.stroke()}
const dot=(x,z,r,c)=>{const q=mp(x,z);g.fillStyle=c;g.fillRect(q[0]-r,q[1]-r,r*2,r*2)};
camps.forEach(k=>dot(k.x,k.z,2,'#2a5a2a'));towers.forEach(w=>{if(!w.dead)dot(w.x,w.z,3,w.team?'#ff5050':'#4aa3ff')});crys.forEach(c=>dot(c.x,c.z,4,c.team?'#ff5050':'#4aa3ff'));
creeps.forEach(c=>{if(!c.dead&&(c.team==ptm||seen(c.x,c.z)))dot(c.x,c.z,1,c.team==2?'#ffb020':c.team?'#ff8080':'#8fc2ff')});
heroes.forEach(h=>{if(!h.dead&&(h.team==ptm||seen(h.x,h.z)))dot(h.x,h.z,h.isP?3:2,h.isP?'#fff':h.team?'#ff5050':'#4aa3ff')})}
let last=performance.now(),fa=0,fn=0;const cam={x:0,z:0};
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
if(run){step(dt);fa+=dt;fn++;if(fa>2){if(fn/fa<40&&q>.75){q-=.25;R.setPixelRatio(Math.min(devicePixelRatio,q));rs()}fa=fn=0}}
document.body.classList.toggle('inm',!!run);document.body.classList.toggle('inr',!!intro);
if(intro){it+=dt;const A=it<3,sx=A?62:-62;C.position.set(sx+(A?-14:14),6,6+Math.sin(it*1.5)*3);C.lookAt(sx,1.8,0);$('cap').textContent=A?'Команда противника':'Ваша команда';$('cap').style.display='block';
heroes.forEach(h=>lab(h.nm,h.x,3.9,h.z,1));if(it>=6){intro=0;run=true;$('cap').style.display='none'}}
else if(menuMode){const u=menuHero.userData,t=now/1000,sn=Math.sin(t*7);u.la.rotation.x=-2.6+sn*.5;u.ra.rotation.x=-2.6-sn*.5;u.ll.rotation.x=sn*.5;u.rl.rotation.x=-sn*.5;u.b.rotation.z=Math.sin(t*3.5)*.12;u.b.position.y=Math.abs(sn)*.1;menuHero.rotation.y=Math.sin(t*1.5)*.5;C.position.set(2.2,2.4,305.6);C.lookAt(1.2,1.5,300)}
else{if(player){cam.x+=(player.x-cam.x)*Math.min(1,dt*8);cam.z+=(player.z-cam.z)*Math.min(1,dt*8)}
C.position.set(cam.x,22,cam.z+14);C.lookAt(cam.x,0,cam.z)}
R.render(S,C)}
requestAnimationFrame(loop);
